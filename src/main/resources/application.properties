spring.application.name=nified-permission-system
spring.datasource.url=jdbc:h2:mem:first_review;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
server.address=127.0.0.1
server.port=18081
permission.jwt.secret=${PERMISSION_JWT_SECRET:}
permission.jwt.expiration-seconds=${PERMISSION_JWT_EXPIRATION_SECONDS:1800}
permission.bootstrap.username=${PERMISSION_BOOTSTRAP_USERNAME:}
permission.bootstrap.password=${PERMISSION_BOOTSTRAP_PASSWORD:}
permission.policy.external-max-days=${PERMISSION_EXTERNAL_MAX_DAYS:365}
permission.policy.temporary-max-days=${PERMISSION_TEMPORARY_MAX_DAYS:90}
permission.policy.zone=${PERMISSION_POLICY_ZONE:Asia/Shanghai}
